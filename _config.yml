# Site settings
title: breuer.dev # site title
description: >- # site description
  learning by doing
lang: en-US # default lang
timezone: Europe/Berlin # set your timezone
mode: light # default theme "dark" | "light"
# used for utterance
repo: breuerfelix/breuerfelix.github.io


# Profile settings
author:
  name: Felix Breuer # author name
  bio: >- # tell to the world
    learning by doing
    <br>
    <a href="https://github.com/breuerfelix" rel="noreferrer" target="_blank">@github</a>
    <a href="https://www.linkedin.com/in/felix-breuer-5b70b3179/" rel="noreferrer" target="_blank">@linkedin</a>
    <a href="https://www.youtube.com/scriptworld" rel="noreferrer" target="_blank">@youtube</a>

  username: felixbreuer # general username
  email: fbreuer@pm.me
  avatar: /assets/img/avatar.webp

  # displayed in the footer
  github: breuerfelix
  twitter: felix_breuer
  patreon: scriptworld
  twitch: scriptworld
  youtube: scriptworld
  linkedin: breuerf

# URL settings
url: "https://breuer.dev"
permalink: /:categories/:title
fathom:
  host: stats.felixbreuer.me
  site_id: MDAXJ

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Keep runtime and font versions aligned with package.json.
mathjax:
  source: https://cdn.jsdelivr.net/npm/mathjax@4.1.3
  font_path: https://cdn.jsdelivr.net/npm/@mathjax/%%FONT%%-font@4.1.3

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: true

# Build settings
sass:
  style: compressed
  sourcemap: never

exclude:
  - node_modules
  - tests
  - scripts
  - playwright.config.mjs
  - package.json
  - package-lock.json
  - playwright-report
  - test-results
  - lighthouserc.cjs
  - lighthouse-reports
  - docs
  - AGENTS.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - shell.nix
  - renovate.json

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
